ip: de25_interconnect_shell
hdl_file: deepskopion_de25_top.vhd
version: 1.0

# DS-P2.187: `ip: de25_interconnect_shell` names no entity, so contract-check
# failed with no-matching-hdl and never compared a port. The shell is the
# target-scoped DE25 board top that wraps the portable deepskopion_core with
# the HPS, lwh2f_axilite_bridge, axil_demux3 and axil_apb_shim:
# deepskopion_de25_top. hdl_file pins it, and port_contract below is that
# entity's real boundary (scaffolded with rr ip contract init, reviewed).
#
# The previous port_contract described the shell's INTERNAL interfaces
# (signals inside deepskopion_de25_top, not ports of any entity), and its
# parameters are not generics of any entity. Kept here as documentation:
#   port_contract:
#     slaves:
#       - { name: lwh2f_axil, protocol: axi-lite, clock_domain: clk_sys, reset: rst_sys }
#       - { name: f2sdram_axi, protocol: axi4, clock_domain: clk_sys, reset: rst_sys }
#     masters:
#       - { name: regbank_axil, protocol: axi-lite, clock_domain: clk_sys, reset: rst_sys }
#     scalars:
#       - { name: irq, dir: out, width: 3 }
#       - { name: ctu_a_apb, dir: out, width: "APB3/32" }
#       - { name: ctu_b_apb, dir: out, width: "APB3/32" }
#     clocks:
#       - { name: clk_sys }
#     resets:
#       - { name: rst_sys, polarity: active_high }
#
#   parameters:
#     - { name: CSR_APERTURE_BASE, default: "0x20000000" }
#     - { name: DDR_RING_BASE, default: "0xA0000000" }
#
# Witnesses. coverage-map reads cocotb @requires tags only, so it reports all
# seven REQs below as missing. Six have a witness in
# tools/tests/test_de25_shell_contract.py (nvc testbenches it runs, plus one
# static source check); coverage-map cannot credit any of them. OPEN GAP (both need a follow-up ticket): (1) those witnesses are
# invisible to the contract gate; (2) DE25-AXIL-002 has NO witness at all —
# tb_axil_demux3 always presents AW and W on the same cycle.
#   DE25-AXIL-001  test_axil_demux_behavior (tb_axil_demux3: one-hot decode)
#   DE25-AXIL-002  none
#   DE25-AXIL-003  test_axil_demux_behavior (tb_axil_demux3: 0x30000 DECERR)
#   DE25-APB-001   test_axil_apb_behavior (tb_axil_apb_shim: setup then
#                  access phase, PSEL/PENABLE held while PREADY is low)
#   DE25-APB-002   test_axil_apb_behavior (tb_axil_apb_shim: no PSEL before W)
#   DE25-APB-003   test_axil_apb_behavior (tb_axil_apb_shim: partial write
#                  refused with SLVERR, no PSEL)
#   DE25-PORT-001  test_portable_core_has_no_vendor_dependency
