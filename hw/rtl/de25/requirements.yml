parameters: []

functional_contract:
  - id: DE25-AXIL-001
    kind: behavioral
    desc: >-
      AXI4-Lite offsets 0x00000, 0x10000, and 0x20000 select exactly one of
      the regbank, CTU-A, or CTU-B downstream interfaces respectively.
  - id: DE25-AXIL-002
    kind: behavioral
    desc: >-
      Independently arriving AXI write-address and write-data channels are
      each accepted once and forwarded to the selected slave without ordering
      assumptions.
  - id: DE25-APB-001
    kind: behavioral
    desc: >-
      A full-word access to either CTU window emits one APB setup phase followed
      by a stable access phase; PSEL, PADDR, PWRITE, and PWDATA remain stable
      while PREADY is low.
  - id: DE25-APB-002
    kind: negative
    desc: >-
      If only AXI AW or only AXI W has arrived, the shim must not assert PSEL
      until both write halves have been accepted.
  - id: DE25-APB-003
    kind: negative
    desc: >-
      A partial AXI write must produce no APB transfer and must return SLVERR,
      because the CTU APB interface has no byte strobes.
  - id: DE25-AXIL-003
    kind: negative
    desc: >-
      An access in reserved offset window 0x30000 must assert no downstream
      valid and must return DECERR locally.
  - id: DE25-PORT-001
    kind: negative
    desc: >-
      The portable deepskopion_core must not reference a vendor primitive
      library or instantiate either vendor's generated block-design/debug shell.
