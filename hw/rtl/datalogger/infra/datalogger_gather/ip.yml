    arbiter (gated on > 1 instance) into the top-level burst
    arbiter, and exposes the single DOUT stream + per-protocol
    PROTO_COUNTERS to the consumer side.

hdl:
  top_module: datalogger_gather
  top_sim:    datalogger_gather

paths:
  sources: .

synthesis:
  mode: rtl
  sources:
    - datalogger_gather.vhd

build:
