# entity contract lives at docs/hardware/datalogger_gather_contract.md
# (markdown sketch) and now at requirements.yml (routertl schema).
#
# Post-D.4 (single-tier): only the burst path is instantiated; the ZS
# framer downstream is the single stamping authority. See deepskopion
# decisions.json D.4.

ip:
  name: datalogger_gather
  library: tich
  language: vhdl
  description: |
    Aggregator that consumes the CAPTURE_PINS matrix + CONFIG bus,
