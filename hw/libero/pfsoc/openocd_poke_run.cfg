#
# DS-P2.145 (PF-L0e) IOSCB live-poke runner — FlashPro5 adapter + MPFS target
# model + the poke script (mss_ioscb_poke.tcl). See openocd_snapshot_run.cfg.

adapter driver ftdi
adapter usb vid_pid 0x1514 0x2008
ftdi channel 0
ftdi layout_init 0x0018 0x001b
transport select jtag

source [find target/microchip/mpfs.cfg]
source [find mss_ioscb_poke.tcl]
