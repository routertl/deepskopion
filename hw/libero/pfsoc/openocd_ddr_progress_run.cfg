# DS-P2.145 (PF-L0e) — OpenOCD runner for the DDR state-machine progress capture
# (OWNER DECISION step 4). Composes the FlashPro5 JTAG bridge adapter with the
# Microchip MPFS target model and mss_ddr_progress.tcl, which halts a U54 (the
# E51 free-runs the eNVM firmware and is un-haltable while spinning in the DDR
# retrain loop) and samples the DDR state-machine runtime statics. Read-only.
#
# Invoke (from the pfsoc dir, openocd-master 0.12):
#   openocd -s <mpfs-target-scripts-dir> \
#           -f hw/libero/pfsoc/openocd_ddr_progress_run.cfg
# (mss_ddr_progress.tcl supplies init/halt/reads/shutdown.)

adapter driver ftdi
adapter usb vid_pid 0x1514 0x2008
ftdi channel 0
ftdi layout_init 0x0018 0x001b
transport select jtag

# Bring in the full MPFS target model (creates mpfs.cpu tap + e51/u54_1..4).
source [find target/microchip/mpfs.cfg]

# The progress script performs init, halts u54_1, samples ddr_training_state /
# retry_count / ddr_diag, then shuts down.
source [find mss_ddr_progress.tcl]
