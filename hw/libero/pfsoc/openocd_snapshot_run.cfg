#
# DS-P2.145 (PF-L0e) IOSCB ITERATION — OpenOCD runner that composes the
# FlashPro5 JTAG bridge adapter with the Microchip MPFS target model and the
# extended MSS register snapshot (mss_register_snapshot.tcl). Read-only: it
# halts a U54 (the E51 free-runs eNVM firmware, un-haltable) and dumps the MSS
# register set including the SCB-space bank-2 enable / flash_valid layer.
#
# Invoke (from the pfsoc dir, openocd-master 0.12):
#   openocd -s <mpfs-target-scripts-dir> \
#           -f hw/libero/pfsoc/openocd_snapshot_run.cfg
# (mss_register_snapshot.tcl supplies init/halt/reads/shutdown.)

adapter driver ftdi
adapter usb vid_pid 0x1514 0x2008
ftdi channel 0
ftdi layout_init 0x0018 0x001b
transport select jtag

# Bring in the full MPFS target model (creates mpfs.cpu tap + e51/u54_1..4).
source [find target/microchip/mpfs.cfg]

# The snapshot script performs init, halts u54_1, reads the register set, and
# shuts down. Path is resolved relative to the -s search dir list.
source [find mss_register_snapshot.tcl]
