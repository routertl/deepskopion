# The PolarFire SoC part of the deployment contract. The public export drops
# sw/linux/pfsoc/, and the exported contract names only what the export carries.
# sw/linux/deployment_contract.py --check adds `targets` below to boot.targets
# when it compares declarations with targets/*.yml. The generated document does
# not read this file.
targets:
  - pfsoc_datalogger

autostart:
  - path: etc/init.d/S49dropbear
    starts: >-
      the dropbear sshd on :22 (its binary is a per-arch staged artefact: armhf
      for the Zynq targets from sw/linux/stage_dropbear_overlay.sh, riscv64 for
      the PolarFire kit from its own python_overlay)

prohibited:
  - mechanism: petalinux
    reason: >-
      Python reaches the rootfs through a per-arch python_overlay (armhf Zynq built by
      sw/linux/build_buildroot.sh and sw/linux/extract_python_overlay.sh; riscv64
      PolarFire via sw/linux/pfsoc/fetch_python_overlay.sh), not through a PetaLinux
      profile.

# The PolarFire (riscv64) target does not use the shared overlay's ARM dropbear.
# Its dropbear and scp are the rv64gc ones extracted into
# sw/linux/pfsoc/python_overlay by sw/linux/pfsoc/build_python_overlay.sh, since
# a riscv64 kernel cannot exec an ARM ELF. Per-arch staging is guarded by
# tools/tests/test_pfsoc_overlay_arch_native.py.
staged_binaries:
  - staged_to: sw/linux/pfsoc/python_overlay/usr/sbin/dropbear
    staged_by: sw/linux/pfsoc/build_python_overlay.sh
