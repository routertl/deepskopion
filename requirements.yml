ip: deepskopion
hdl_file: hw/rtl/deepskopion_core.vhd
# DS-P2.192: system-level contract. It makes the project a project-level FDD
# target (rr fdd), so FDD.md beside it aggregates this file, ip.yml and
# project_regbank.yml. The anchor is deepskopion_core, the portable core every
# Linux target wraps (Zybo deepskopion_top, DE25 deepskopion_de25_top,
# PolarFire deepskopion_pfsoc_top). port_contract was scaffolded with
# `rr ip contract init hw/rtl/deepskopion_core.vhd`; the reset polarity is
# active high (rst_sys_q, core p_rst_sys_q; rst_sys_in_ddr init '1').
# The per-block contracts stay in hw/rtl/**/requirements.yml.
#
# Witnesses. coverage-map reads cocotb @requires tags only, so it reports the
# four REQs below as missing; each has a pytest witness under tools/tests:
#   DS-SYS-PORT-001  test_de25_shell_contract.py::test_portable_core_has_no_vendor_dependency
#                    test_portable_fifo_contract.py::test_portable_core_has_no_vendor_fifo_or_primitive_dependency
#   DS-SYS-CLK-001   test_core_sys_clk_generic_guard.py
#   DS-SYS-DDR-001   test_core_ddr_base_generic_guard.py
#   DS-SYS-REG-001   test_regbank_preamble_ds_t2_87.py::test_declared_constants_match_their_sources
