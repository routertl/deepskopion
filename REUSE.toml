version = 1
SPDX-PackageName = "deepskopion"
SPDX-PackageSupplier = "Daniel J. Mazure <djmazure@routertl.com>"
SPDX-PackageDownloadLocation = "https://github.com/routertl/deepskopion"

# ---------------------------------------------------------------------------
# Licensing boundary (open-core hardware + software reference design)
#
#   Gateware / RTL + its verification + design docs ... CERN-OHL-W-2.0
#   Software (runs on a CPU: daemon, decoders, tools) . MPL-2.0
#   (DS-D.41, 2026-09-04: weak/file-level reciprocity on both sides so the
#   design can be embedded in products; changes to OUR files come back.)
#
# This single file declares per-path licensing so the boundary is
# machine-readable without a header in every one of the ~480 files.
# Validate full coverage with:  pipx run reuse lint
# ---------------------------------------------------------------------------

# --- Gateware / hardware design sources + their testbenches ---------------
[[annotations]]
path = ["hw/**", "sim/**"]
# libs/ holds VENDORED third-party cores under their upstream licences; per-core
# annotations are DS-P2.120 (never stamp them as ours).
SPDX-FileCopyrightText = "2026 Daniel J. Mazure"
SPDX-License-Identifier = "CERN-OHL-W-2.0"

# --- Hardware design documentation ----------------------------------------
[[annotations]]
path = ["docs/**", "README.md", "*.md", "*.yml", "*.yaml", "Makefile", "VERSION", "mkdocs.yml"]
SPDX-FileCopyrightText = "2026 Daniel J. Mazure"
SPDX-License-Identifier = "CERN-OHL-W-2.0"

# --- Software: capture daemon, decoders, telemetry, build tooling ---------
[[annotations]]
path = ["sw/**", "tools/**", "*.py"]
SPDX-FileCopyrightText = "2026 Daniel J. Mazure"
SPDX-License-Identifier = "MPL-2.0"

# --- Vendored cross-repo wire contracts (WS-C0) ----------------------------
# Checker, fixtures and their compiled MessagePack streams. Same licence as the
# software that speaks them; declared separately because this tree is VENDORED
# verbatim into every repo that implements the protocol, so its licensing has to
# travel with it rather than being inherited from a path prefix.
[[annotations]]
path = ["contracts/**"]
SPDX-FileCopyrightText = "2026 Daniel J. Mazure"
SPDX-License-Identifier = "MPL-2.0"

# ===========================================================================
# libs/ — VENDORED third-party cores (DS-P2.120)
#
# Everything below is fetched by `rr pkg install` / `rr workspace sync` and
# stays under its UPSTREAM licence and copyright. Nothing here is ours except
# the RouteRTL-owned packages (libs/routertl/**, libs/local/**), which carry
# the MIT identifier their own headers declare. Evidence per subtree is the
# upstream LICENSE at the ip.lock-pinned commit plus the in-file headers.
# Later tables win over earlier ones, so these override the "*.yml" catch-all
# above for the ip.yml manifests that ship inside a vendored core.
#
# libs/enclustra/** and libs/open-logic/** are gitignored (materialised by
# `rr workspace sync`); their tables document the truth for anyone reading a
# synced tree, but `reuse lint` never sees them.
# ===========================================================================

# --- CTU CAN FD IP core (Czech Technical University, FEE) -----------------
# ip.lock: https://gitlab.fel.cvut.cz/canbus/ctucanfd_ip_core.git
#          @ b76a8888ecd10d2a1f38590eadfc8a3dc2394b48
# Upstream LICENSE (and every RTL header) carries TWO notices: the 2015-2020
# work is MIT; the 2021-present work is a custom permission notice that
# FORBIDS commercial use unless agreed with the copyright holder, and the CAN
# protocol itself needs a Bosch patent licence for silicon. Hence the AND.
[[annotations]]
path = ["libs/.targets/*/ctu-fee/ctucanfd_ip_core/**"]
SPDX-FileCopyrightText = [
    "2021-present Ondrej Ille",
    "2015-2020 Ondrej Ille, Martin Jerabek (Czech Technical University, Faculty of Electrical Engineering, Department of Measurement)",
]
SPDX-License-Identifier = "MIT AND LicenseRef-CTU-CAN-FD-NonCommercial"

# The register-map files generated by Ondrej Ille's "Register map generation
# tool" carry ONLY his 2018 MIT-style notice (no 2021-present clause). Listed
# by name because three sibling files in the same generated/ directory DO
# carry the dual notice and stay under the table above.
[[annotations]]
path = [
    "libs/.targets/*/ctu-fee/ctucanfd_ip_core/src/memory_registers/generated/address_decoder.vhd",
    "libs/.targets/*/ctu-fee/ctucanfd_ip_core/src/memory_registers/generated/cmn_reg_map_pkg.vhd",
    "libs/.targets/*/ctu-fee/ctucanfd_ip_core/src/memory_registers/generated/memory_bus.vhd",
    "libs/.targets/*/ctu-fee/ctucanfd_ip_core/src/memory_registers/generated/memory_reg_os.vhd",
    "libs/.targets/*/ctu-fee/ctucanfd_ip_core/src/memory_registers/generated/memory_reg_os_lock.vhd",
    "libs/.targets/*/ctu-fee/ctucanfd_ip_core/src/memory_registers/generated/memory_reg_rw.vhd",
    "libs/.targets/*/ctu-fee/ctucanfd_ip_core/src/memory_registers/generated/memory_reg_rw_lock.vhd",
    "libs/.targets/*/ctu-fee/ctucanfd_ip_core/src/memory_registers/generated/read_access_signaler.vhd",
]
SPDX-FileCopyrightText = "2018 Ondrej Ille <ondrej.ille@gmail.com>"
SPDX-License-Identifier = "MIT"

# --- Open Logic (olo_base_*) — gitignored, synced -------------------------
# ip.lock: https://github.com/open-logic/open-logic.git
#          @ d1407a7427d9201a7bcd8c37749ec083b13006dc
# Upstream License.txt is the "PSI HDL Library License, Version 1.0":
# LGPL-2.1-or-later plus an exception that lets binaries / bitstreams ship
# under the user's own terms. Headers: (c) 2018 Paul Scherrer Institute,
# Switzerland; (c) 2024-2025 Oliver Bruendler. No SPDX id exists for it, and
# because the subtree is gitignored `reuse lint` never sees a file that uses
# it — a LicenseRef table + LICENSES/ text here would only be flagged as an
# "unused licence" and fail the lint. So it is recorded HERE and in
# LICENSE.md, not as a table. Add the table (path "libs/open-logic/**",
# SPDX-License-Identifier "LicenseRef-PSI-HDL-Library-License-1.0", text =
# upstream License.txt) the day that subtree becomes tracked.

# --- Enclustra en_cl_fix (fixed-point resize) — gitignored, synced ---------
# ip.lock: https://github.com/enclustra/en_cl_fix.git
#          @ d2ce1a617bc8ba466244a4e500a6edbeea6dba7a
# Upstream LICENSE.md is MIT (2024); the vendored headers say 2024-2025.
[[annotations]]
path = ["libs/enclustra/**"]
SPDX-FileCopyrightText = "2024-2025 Enclustra GmbH, Switzerland (info@enclustra.com)"
SPDX-License-Identifier = "MIT"

# --- RouteRTL SDK built-in units + rr_ddr_stream (RouteRTL-owned) ----------
# The sdk://src/units/* files declare "SPDX-License-Identifier: MIT" in their
# own headers; rr_ddr_stream's upstream LICENSE (bitbucket dasjimaz/rr-ddr-stream
# @ 6d1089a1e01f016777a118cc9af1c88774a195f8) and its ip.yml `license: MIT`
# say the same. NOT the CERN-OHL-W of this design: these are separately
# published packages and keep their own licence when vendored.
[[annotations]]
path = ["libs/routertl/**"]
SPDX-FileCopyrightText = "2024-2026 Daniel J. Mazure"
SPDX-License-Identifier = "MIT"

# --- Third-party GPL inputs of the init-script parser (DS-P3.341) -------------
# The patch adds a parse-tree dump to BusyBox's ash; the config is Buildroot's package/busybox/busybox.config
# (Buildroot 2024.11.4, the build of the DE25 image's busybox). Both are inputs to a BusyBox build that runs as a
# separate process: nothing here is linked into, or changes the licence of, any other file.
[[annotations]]
path = ["tools/ash_dump/ash-dump.patch", "tools/ash_dump/busybox.config"]
SPDX-FileCopyrightText = ["2026 Daniel J. Mazure", "BusyBox and Buildroot contributors"]
SPDX-License-Identifier = "GPL-2.0-only"
