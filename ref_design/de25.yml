# The DE25 reference design (target de25_datalogger). Published with `rr ref publish ref_design/de25.yml`.
ref_design:
  org: routertl
  name: deepskopion-de25
  version: "0.1.0"
  description: "Deepskopion hardware datalogger on Terasic DE25-Standard (Intel Agilex 5 SoC)"
  license: "CERN-OHL-W-2.0 AND MPL-2.0"
  tags:
    - deepskopion
    - datalogger
    - agilex-5
    - de25
    - quartus
    - packet-capture

target:
  board: de25-standard
  vendor: altera
  family: agilex-5
  part: A5ED013BB32AE4SCS
  tool: Quartus Pro
  tool_version: "25.3.1"

project:
  top_module: deepskopion_de25_top
  language: vhdl

uses:
  - ref: open-logic/olo_base_fifo_sync
    version: "^4.4.1"
  - ref: open-logic/olo_base_fifo_async
    version: "^4.4.1"
  - ref: open-logic/olo_base_wconv_n2xn
    version: "^4.4.1"
  - ref: open-logic/olo_base_wconv_xn2n
    version: "^4.4.1"
  - ref: enclustra/en_cl_fix_resize
    version: "^d2ce1a617bc8"
  - ref: routertl/rr_ddr_stream
    version: "^0.3.6"

source:
  repo: https://github.com/routertl/deepskopion
  commit: cac8361a9c78df5d1952abf7bc7e9ed255a634fa

build:
  command: "rr target set de25_datalogger && rr synth run && rr bitstream"
  expected_bitstream: "build/de25_datalogger/bitstream/deepskopion.sof"
  estimated_time_minutes: 15

resources:
  luts: 28129
  ffs: 0
  bram_kbits: 895
  fmax_mhz: 100.4

verification:
  last_verified_commit: "cac8361a9c78df5d1952abf7bc7e9ed255a634fa"
  last_verified_tool_version: "25.3.1"
  last_verified_date: "2026-09-04"
  status: sandbox-verified
