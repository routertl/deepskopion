# Reviewed exceptions for tools/public_artifact_hygiene.py: upstream constants
# compiled into third-party runtimes of the Zybo images (class F of the image
# hygiene triage). Owner ruling 2026-11-11: exact match only.
#
# Each entry excuses ONE literal in ONE archive member, and nothing else:
#   member   the member path inside the image, compared whole: a finding matches
#            when its name ends with "!" + member. No globs, no directories.
#   kind     the finding kind the scanner prints.
#   literal  the exact string, given as parts that are joined when loaded, so
#            this file does not itself carry the strings the scanner refuses.
#   source   where the string comes from upstream.
# A listed string in any other member, any other string in a listed member, and
# any new finding still fail. Adding an entry is a reviewed change.

entries:
  - member: usr/sbin/dropbear
    kind: private key
    literal: ["-----BEGIN RSA ", "PRIVATE KEY-----"]
    source: dropbear 2024.86 src/keyimport.c, key-format header of the import parser
  - member: usr/sbin/dropbear
    kind: private key
    literal: ["-----BEGIN EC ", "PRIVATE KEY-----"]
    source: dropbear 2024.86 src/keyimport.c, key-format header of the import parser
  - member: usr/sbin/dropbear
    kind: private key
    literal: ["-----BEGIN OPENSSH ", "PRIVATE KEY-----"]
    source: dropbear 2024.86 src/keyimport.c, key-format header of the import parser
  - member: usr/lib/libpython3.12.so
    kind: developer home
    literal: ["/Users", "/Barney"]
    source: CPython 3.12 Lib/ntpath.py splitroot docstring, frozen into libpython
