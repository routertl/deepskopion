<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" font-family="Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .dom { stroke-width: 1.2; }
    .pl { fill: #eef4fb; stroke: #5b7fa6; }
    .ps { fill: #f3eefa; stroke: #7a5ba6; }
    .host { fill: #eef8f0; stroke: #5b9a6a; }
    .blk { fill: #ffffff; stroke: #37474f; stroke-width: 1.3; }
    .dl { fill: #ffffff; stroke: #1565c0; stroke-width: 1.3; }
    .lbl { font-size: 13px; font-weight: 700; fill: #263238; }
    .t { font-size: 12px; font-weight: 700; fill: #263238; }
    .s { font-size: 10.5px; fill: #455a64; }
    .m { font-size: 10px; font-family: Menlo, Consolas, monospace; fill: #37474f; }
    .data { stroke: #1565c0; stroke-width: 2.2; fill: none; }
    .ts { stroke: #b26a00; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    .ctl { stroke: #7a5ba6; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
  </style>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b26a00"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5ba6"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="980" height="420"/>

  <!-- FPGA fabric -->
  <rect class="dom pl" x="12" y="12" width="470" height="396" rx="10"/>
  <text class="lbl" x="26" y="34">FPGA fabric</text>

  <rect class="blk" x="34" y="52" width="140" height="44" rx="5"/>
  <text class="t" x="44" y="72">Global timestamp</text>
  <text class="s" x="44" y="88">one free-running counter</text>

  <rect class="dl" x="34" y="120" width="140" height="34" rx="5"/><text class="t" x="44" y="142">UART datalogger</text>
  <rect class="dl" x="34" y="164" width="140" height="34" rx="5"/><text class="t" x="44" y="186">I2C datalogger</text>
  <rect class="dl" x="34" y="208" width="140" height="34" rx="5"/><text class="t" x="44" y="230">SPI / QSPI datalogger</text>
  <rect class="dl" x="34" y="252" width="140" height="34" rx="5"/><text class="t" x="44" y="274">CAN FD datalogger</text>
  <rect class="dl" x="34" y="296" width="140" height="34" rx="5"/><text class="t" x="44" y="318">Edge datalogger</text>
  <text class="s" x="34" y="352">Pins in, frames decoded,</text>
  <text class="s" x="34" y="366">errors detected, each record</text>
  <text class="s" x="34" y="380">stamped from the counter.</text>

  <path class="ts" d="M60,96 V106 H22 V313"/>
  <path class="ts" d="M22,137 H30" marker-end="url(#at)"/>
  <path class="ts" d="M22,181 H30" marker-end="url(#at)"/>
  <path class="ts" d="M22,225 H30" marker-end="url(#at)"/>
  <path class="ts" d="M22,269 H30" marker-end="url(#at)"/>
  <path class="ts" d="M22,313 H30" marker-end="url(#at)"/>

  <rect class="blk" x="236" y="168" width="104" height="70" rx="5"/>
  <text class="t" x="246" y="190">Arbiter and</text>
  <text class="t" x="246" y="205">framer</text>
  <text class="m" x="246" y="224">zs_msg records</text>

  <path class="data" d="M174,137 H214"/>
  <path class="data" d="M174,181 H214"/>
  <path class="data" d="M174,225 H214"/>
  <path class="data" d="M174,269 H214"/>
  <path class="data" d="M174,313 H214"/>
  <path class="data" d="M214,137 V313"/>
  <path class="data" d="M214,203 H232" marker-end="url(#ad)"/>

  <rect class="blk" x="362" y="168" width="108" height="70" rx="5"/>
  <text class="t" x="372" y="190">DDR writer</text>
  <text class="m" x="372" y="207">rr_ddr_stream</text>
  <text class="s" x="372" y="224">AXI4 to board DDR</text>
  <path class="data" d="M340,203 H358" marker-end="url(#ad)"/>

  <rect class="blk" x="350" y="300" width="124" height="56" rx="5"/>
  <text class="t" x="358" y="322">Register bank</text>
  <text class="m" x="358" y="340">project_regbank.yml</text>

  <!-- Processor subsystem -->
  <rect class="dom ps" x="500" y="12" width="250" height="396" rx="10"/>
  <text class="lbl" x="514" y="34">Processor subsystem (Linux)</text>
  <text class="s" x="514" y="50">Zynq PS or Agilex HPS</text>

  <rect class="blk" x="522" y="168" width="206" height="70" rx="5"/>
  <text class="t" x="532" y="190">Ring buffer in board DDR</text>
  <text class="s" x="532" y="207">reserved by the device tree,</text>
  <text class="s" x="532" y="222">written by the fabric only</text>
  <path class="data" d="M470,203 H518" marker-end="url(#ad)"/>

  <rect class="blk" x="522" y="276" width="206" height="80" rx="5"/>
  <text class="t" x="532" y="298">Capture daemon</text>
  <text class="m" x="532" y="315">python3 -m sw.stream</text>
  <text class="s" x="532" y="332">drains the ring, decodes,</text>
  <text class="s" x="532" y="347">serves the stream</text>
  <path class="data" d="M625,238 V272" marker-end="url(#ad)"/>
  <path class="ctl" d="M522,328 H478" marker-end="url(#ac)" marker-start="url(#ac)"/>
  <text class="s" x="530" y="374">MMIO to the register bank</text>

  <!-- Host -->
  <rect class="dom host" x="768" y="12" width="200" height="396" rx="10"/>
  <text class="lbl" x="782" y="34">Host</text>

  <rect class="blk" x="784" y="246" width="168" height="44" rx="5"/>
  <text class="t" x="794" y="266">RouteWave</text>
  <text class="s" x="794" y="282">waveform and protocol viewer</text>

  <rect class="blk" x="784" y="306" width="168" height="44" rx="5"/>
  <text class="t" x="794" y="326">Other clients</text>
  <text class="s" x="794" y="342">scripts, test benches</text>

  <path class="data" d="M728,300 H760 V268 H780" marker-end="url(#ad)"/>
  <path class="data" d="M760,300 V328 H780" marker-end="url(#ad)"/>
  <text class="m" x="784" y="376">TCP 7475</text>
  <text class="m" x="784" y="390">wave_stream_v1</text>
</svg>
