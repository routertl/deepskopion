<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 702" width="980" height="702" font-family="Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f7f9fc; stroke: #90a4ae; stroke-width: 1.2; }
    .blk { fill: #ffffff; stroke: #37474f; stroke-width: 1.3; }
    .src { fill: #fff3e6; stroke: #b26a00; stroke-width: 1.3; }
    .ext { fill: #fafafa; stroke: #78909c; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .lbl { font-size: 13px; font-weight: 700; fill: #263238; }
    .t { font-size: 12px; font-weight: 700; fill: #263238; }
    .s { font-size: 10.5px; fill: #455a64; }
    .m { font-size: 9.5px; font-family: Menlo, Consolas, monospace; fill: #37474f; }
    .data { stroke: #1565c0; stroke-width: 2.2; fill: none; }
    .alt { stroke: #78909c; stroke-width: 1.4; stroke-dasharray: 5 3; fill: none; }
  </style>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="980" height="702"/>

  <!-- Panel A: Zybo -->
  <rect class="panel" x="12" y="12" width="956" height="214" rx="10"/>
  <text class="lbl" x="26" y="34">Digilent Zybo Z7-20 (Zynq-7000)</text>

  <rect class="src" x="26" y="58" width="166" height="74" rx="5"/>
  <text class="t" x="36" y="78">Linux on the PS7</text>
  <text class="s" x="36" y="95">UART0, I2C0, SPI0,</text>
  <text class="s" x="36" y="110">CAN0 and CAN1 drivers</text>
  <text class="s" x="36" y="125">send real traffic</text>

  <rect class="blk" x="212" y="58" width="176" height="74" rx="5"/>
  <text class="t" x="222" y="78">EMIO routing (hw/bd/)</text>
  <text class="m" x="222" y="96">ds_emio_uart_i2c_spi.tcl</text>
  <text class="m" x="222" y="111">ds_emio_can.tcl</text>

  <rect class="blk" x="408" y="58" width="176" height="74" rx="5"/>
  <text class="t" x="418" y="78">Source select (hw/rtl/emio/)</text>
  <text class="m" x="418" y="96">ds_emio_mux.vhd</text>
  <text class="m" x="418" y="111">glitch_filter.vhd</text>
  <text class="m" x="418" y="126">EMIO_MUX_SEL register</text>

  <rect class="ext" x="408" y="160" width="176" height="44" rx="5"/>
  <text class="t" x="418" y="180">PMOD pins</text>
  <text class="s" x="418" y="196">external buses</text>

  <rect class="blk" x="604" y="58" width="156" height="74" rx="5"/>
  <text class="t" x="614" y="78">Dataloggers</text>
  <text class="s" x="614" y="95">UART, I2C, SPI,</text>
  <text class="s" x="614" y="110">CAN, Edge</text>

  <rect class="blk" x="780" y="58" width="176" height="74" rx="5"/>
  <text class="t" x="790" y="78">Gather, DDR ring, daemon</text>
  <text class="m" x="790" y="96">datalogger_gather.vhd</text>
  <text class="s" x="790" y="111">S_AXI_HP0 to the DDR ring,</text>
  <text class="s" x="790" y="126">read by sw.stream</text>

  <path class="data" d="M192,95 H208" marker-end="url(#ad)"/>
  <path class="data" d="M388,95 H404" marker-end="url(#ad)"/>
  <path class="data" d="M584,95 H600" marker-end="url(#ad)"/>
  <path class="data" d="M760,95 H776" marker-end="url(#ad)"/>
  <path class="alt" d="M496,160 V136" marker-end="url(#ag)"/>

  <!-- Panel B: DE25 -->
  <rect class="panel" x="12" y="244" width="956" height="214" rx="10"/>
  <text class="lbl" x="26" y="266">Terasic DE25 (Agilex 5)</text>

  <rect class="src" x="26" y="290" width="166" height="74" rx="5"/>
  <text class="t" x="36" y="310">Linux on the HPS</text>
  <text class="s" x="36" y="327">the daemon writes the</text>
  <text class="s" x="36" y="342">STIM_* registers over</text>
  <text class="s" x="36" y="357">the lightweight bridge</text>

  <rect class="blk" x="212" y="290" width="176" height="74" rx="5"/>
  <text class="t" x="222" y="310">Stimulus generator</text>
  <text class="m" x="222" y="328">hw/rtl/stimulus/</text>
  <text class="m" x="222" y="343">ds_stimulus_gen.vhd</text>
  <text class="m" x="222" y="358">project_regbank.yml</text>

  <rect class="blk" x="408" y="290" width="176" height="74" rx="5"/>
  <text class="t" x="418" y="310">Source select (hw/rtl/emio/)</text>
  <text class="m" x="418" y="328">ds_emio_mux.vhd</text>
  <text class="m" x="418" y="343">EMIO_MUX_SEL register</text>

  <rect class="ext" x="408" y="392" width="176" height="44" rx="5"/>
  <text class="t" x="418" y="412">GPIO pins</text>
  <text class="s" x="418" y="428">external buses</text>

  <rect class="blk" x="604" y="290" width="156" height="74" rx="5"/>
  <text class="t" x="614" y="310">Dataloggers</text>
  <text class="s" x="614" y="327">UART, I2C, SPI, Edge</text>

  <rect class="blk" x="780" y="290" width="176" height="74" rx="5"/>
  <text class="t" x="790" y="310">Gather, DDR ring, daemon</text>
  <text class="m" x="790" y="328">datalogger_gather.vhd</text>
  <text class="s" x="790" y="343">f2sdram to the DDR ring,</text>
  <text class="s" x="790" y="358">read by sw.stream</text>

  <path class="data" d="M192,327 H208" marker-end="url(#ad)"/>
  <path class="data" d="M388,327 H404" marker-end="url(#ad)"/>
  <path class="data" d="M584,327 H600" marker-end="url(#ad)"/>
  <path class="data" d="M760,327 H776" marker-end="url(#ad)"/>
  <path class="alt" d="M496,392 V368" marker-end="url(#ag)"/>

  <!-- Panel C: PolarFire SoC Discovery Kit -->
  <rect class="panel" x="12" y="476" width="956" height="214" rx="10"/>
  <text class="lbl" x="26" y="498">Microchip PolarFire SoC Discovery Kit</text>

  <rect class="src" x="26" y="522" width="166" height="74" rx="5"/>
  <text class="t" x="36" y="542">Linux on the MSS</text>
  <text class="s" x="36" y="559">MMUART_1 (/dev/ttyS1)</text>
  <text class="s" x="36" y="574">sends UART traffic</text>

  <rect class="blk" x="212" y="522" width="176" height="74" rx="5"/>
  <text class="t" x="222" y="542">MSS fabric routing</text>
  <text class="s" x="222" y="560">MSS configurator: UART,</text>
  <text class="s" x="222" y="575">I2C, SPI, CAN to fabric</text>

  <rect class="src" x="212" y="618" width="176" height="56" rx="5"/>
  <text class="t" x="222" y="638">Stimulus generator</text>
  <text class="s" x="222" y="655">I2C, SPI, Edge (STIM_*)</text>

  <rect class="blk" x="408" y="522" width="176" height="74" rx="5"/>
  <text class="t" x="418" y="542">Source select</text>
  <text class="m" x="418" y="560">EMIO_MUX_SEL</text>
  <text class="s" x="418" y="575">bits [11:8] = MSS,</text>
  <text class="s" x="418" y="590">else stimulus</text>

  <rect class="ext" x="408" y="624" width="176" height="44" rx="5"/>
  <text class="t" x="418" y="644">Header GPIO</text>
  <text class="s" x="418" y="660">external buses</text>

  <rect class="blk" x="604" y="522" width="156" height="74" rx="5"/>
  <text class="t" x="614" y="542">Dataloggers</text>
  <text class="s" x="614" y="559">UART, I2C, SPI, Edge</text>

  <rect class="blk" x="780" y="522" width="176" height="74" rx="5"/>
  <text class="t" x="790" y="542">Gather, DDR ring, daemon</text>
  <text class="m" x="790" y="560">datalogger_gather.vhd</text>
  <text class="s" x="790" y="575">FIC1 to the DDR ring,</text>
  <text class="s" x="790" y="590">read by sw.stream</text>

  <path class="data" d="M192,559 H208" marker-end="url(#ad)"/>
  <path class="data" d="M388,559 H404" marker-end="url(#ad)"/>
  <path class="data" d="M388,646 H396 V590 H404" marker-end="url(#ad)"/>
  <path class="data" d="M584,559 H600" marker-end="url(#ad)"/>
  <path class="data" d="M760,559 H776" marker-end="url(#ad)"/>
  <path class="alt" d="M496,624 V600" marker-end="url(#ag)"/>
</svg>
