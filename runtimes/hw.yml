# DeepSkopion DE25 silicon claims (DS-P2.161 / RTL-D.354 pilot).
#
# This is the tracked rr.hw.contract/v1 contract. Deployment identity remains
# in gitignored runtimes/hw.local.yml. Every live replay must first record the
# Altera REA build ID (`rea-jtag-build-id-32`) with `rr hw bit-sha`; the target
# stamps C_REA_BUILD_ID through targets/de25_datalogger.yml:328-346 and the
# DE25 top connects it to u_rea at hw/rtl/de25/deepskopion_de25_top.vhd:827-829.
#
# Scope is the shipped DE25 capture path. “Trigger” below means the implemented
# edge-datalogger software read-trigger (CONFIG payload 0b11), not the planned
# semantic TRIG_MATCH engine in docs/REQUIREMENTS_ROADMAP.md R7.
#
# Limits come from RTL/software specifications, never a measured run. The
# checked-in runs/hw/<REQ>/*/run.json files are DE25 silicon receipts with a
# CONFIRMED REA identity (DS-P2.165; witness in
# docs/hardware/evidence/ds_p2_165/). The desk mock receipts are retired.

schema: "rr.hw.contract/v1"
version: 0.2
extends: "hw.local.yml"
# The map-access preamble walks this map before every REQ. It is
# project_regbank.yml at the lwh2f regbank base in byte mode, generated by
# tools/de25_regbank_map.py: project_regbank.yml alone resolves at physical
# 0 in word mode (GIT_HASH 0x0, HEARTBEAT_CNT 0x300) (DS-T2.86).
regbank: "runtimes/de25_regbank_map.yml"

requirements:
  - id: "DS-DE25-CLK-001"
    description: >-
      The DE25 sample/timestamp clock is 100 MHz (10 ns/tick). CLOCK2_50 is
      multiplied by two by the fabric IOPLL
      (hw/rtl/de25/deepskopion_de25_top.vhd:345-362,463-468), the core generic
      is G_SYS_CLK_HZ=100_000_000 (:774), and HEARTBEAT_CNT increments every
      clk_sys cycle (hw/rtl/deepskopion_core.vhd:1642-1651).
    expected_outcome: "pass"
    falsifier: "DS-DE25-CLK-001-RED"
    target: {board: "de25-standard"}
    capture_chain: &de25_chain
      id: "hps-devmem+rea-build-id"
      bitstream_identity_required: true
      self_check_required: false
    preconditions: &live_preconditions
      - {name: "sof_programmed", via: "de25_datalogger image whose REA G_BUILD_ID is CONFIRMED by rr hw bit-sha --record-chain"}
      - {name: "hps_bridges_enabled", via: "generated DE25 boot command ran bridge enable"}
    steps:
      - idx: 1
        kind: "rate"
        read: "0x200000C0"
        interval_s: 10.0
        min_per_s: 90000000
        max_per_s: 110000000
        width: 32
        derivation: >-
          Nominal 100,000,000/s is CLOCK2_50 x2. The +/-10% is a host timing
          allowance and remains strictly between the nearest wrong clocks,
          50 MHz and 125 MHz. A 10 s maximum delta is below 2^32.
    assertions:
      - {id: "C1", expr: "step[1].satisfied == true"}

  - id: "DS-DE25-CLK-001-RED"
    description: >-
      Negative control: a pre-DS-P2.155 image runs clk_sys directly from the
      50 MHz board clock, so the same 90-110 MHz assertion must fail.
    expected_outcome: "demonstrated_broken"
    falsifier: "none"
    falsifier_waiver: "Negative control for DS-DE25-CLK-001; the 50 MHz image is a physically achievable wrong-clock state."
    target: {board: "de25-standard"}
    capture_chain: *de25_chain
    preconditions: *live_preconditions
    steps:
      - idx: 1
        kind: "rate"
        read: "0x200000C0"
        interval_s: 10.0
        min_per_s: 90000000
        max_per_s: 110000000
        width: 32
        derivation: "The green 100 MHz +/-10% band; a 50 MHz counter is below its 90 MHz floor."
    assertions:
      - {id: "C1", expr: "step[1].satisfied == true"}

  - id: "DS-DE25-INTEG-001"
    description: >-
      While a 4 Medge/s self-test stream is active, fresh framer words reach
      the DDR ring and every exposed loss/error witness stays clear. Freshness
      is proven by a nonzero RING_WRITE_PTR delta measured inside the recipe;
      prior boot traffic and sticky bvalid therefore cannot satisfy the REQ.
      The source is STIM_EDGE_CONTROL half-period 25 at 100 MHz
      (hw/rtl/stimulus/ds_stimulus_gen.vhd:516-524), routed by
      project_regbank.yml EMIO_MUX_SEL[7].
    expected_outcome: "pass"
    falsifier: "DS-DE25-INTEG-001-RED"
    target: {board: "de25-standard"}
    capture_chain: *de25_chain
    preconditions:
      - {name: "sof_programmed", via: "de25_datalogger image whose REA G_BUILD_ID is CONFIRMED by rr hw bit-sha --record-chain"}
      - {name: "fresh_configuration", via: "power cycle and boot; telemetry counters reset with rst_sys"}
      - {name: "hps_bridges_enabled", via: "generated DE25 boot command ran bridge enable"}
      - {name: "no_foreign_armer", via: "no other process writes the stimulus or datalogger controls"}
    steps:
      - {idx: 1, kind: "poke", addr: "0x20000020", value: "0x00000800", comment: "EDGE0 disabled/reset"}
      - {idx: 2, kind: "poke", addr: "0x20000020", value: "0x00000801", comment: "EDGE0 capture enabled"}
      - {idx: 3, kind: "poke", addr: "0x20000024", value: "0x00000080", comment: "route stimulus EDGE_O to EDGE0"}
      - {idx: 4, kind: "poke", addr: "0x20000244", value: "0x00000191", comment: "free-running toggle, half-period 25 clocks"}
      - idx: 5
        kind: "rate"
        read: "0x20000150"
        interval_s: 2.0
        min_per_s: 3600000
        max_per_s: 26400000
        width: 32
        derivation: >-
          E=100e6/25=4e6 edges/s. Each edge contributes one word and each
          batch adds a five-word header (edge_batcher.vhd; zs_msg_framer.vhd),
          hence [E,6E] words/s; +/-10% host timing gives [3.6e6,26.4e6].
          A stale absolute pointer has delta zero and fails this step.
      - {idx: 6, kind: "peek", addr: "0x200000C4", expected: "0x00000000", comment: "FIFO_OVERFLOW_CNT"}
      - {idx: 7, kind: "peek", addr: "0x20000168", expected: "0x00000000", comment: "DDR_BACKPRESSURE_CNT"}
      - {idx: 8, kind: "peek", addr: "0x20000100", expected: "0x00000000", comment: "ERR_CNT_EDGE"}
      - {idx: 9, kind: "peek", addr: "0x20000170", expected: "0x00000000", comment: "EMIT_VALID_CNT"}
      - {idx: 10, kind: "wait_for", addr: "0x20000050", mask: "0x00010400", expected: "0x00000000", timeout_s: 1.0, comment: "DMA write_error live/sticky clear"}
      - {idx: 11, kind: "poke", addr: "0x20000244", value: "0x00000000", comment: "stop stimulus"}
    assertions:
      - {id: "I1", expr: "step[5].satisfied == true"}
      - {id: "I2", expr: "step[6].observed == step[6].expected"}
      - {id: "I3", expr: "step[7].observed == step[7].expected"}
      - {id: "I4", expr: "step[8].observed == step[8].expected"}
      - {id: "I5", expr: "step[9].observed == step[9].expected"}
      - {id: "I6", expr: "step[10].satisfied == true"}

  - id: "DS-DE25-INTEG-001-RED"
    description: >-
      Negative control: leave EDGE0 disabled while the identical stimulus runs.
      No new framer words can be produced, so the fresh-movement assertion is
      RED even if status registers contain stale healthy values.
    expected_outcome: "demonstrated_broken"
    falsifier: "none"
    falsifier_waiver: "Negative control for DS-DE25-INTEG-001; an unarmed capture input is physically achievable."
    target: {board: "de25-standard"}
    capture_chain: *de25_chain
    preconditions: *live_preconditions
    steps:
      - {idx: 1, kind: "poke", addr: "0x20000020", value: "0x00000800", comment: "fault injection: EDGE0 remains disabled"}
      - {idx: 2, kind: "poke", addr: "0x20000024", value: "0x00000080", comment: "route stimulus EDGE_O to EDGE0"}
      - {idx: 3, kind: "poke", addr: "0x20000244", value: "0x00000191", comment: "same 4 Medge/s stimulus"}
      - idx: 4
        kind: "rate"
        read: "0x20000150"
        interval_s: 2.0
        min_per_s: 3600000
        max_per_s: 26400000
        width: 32
        derivation: "The green design-derived 4 Medge/s word band; disabled EDGE0 produces 0 words/s."
      - {idx: 5, kind: "poke", addr: "0x20000244", value: "0x00000000"}
    assertions:
      - {id: "I1", expr: "step[4].satisfied == true"}

  - id: "DS-DE25-TRIG-001"
    description: >-
      The implemented EDGE0 software read-trigger emits a fresh capture while
      capture remains disabled. The edge-datalogger CONFIG payload 0b11 is
      C_ENABLE_READ_TRIGGER_OFF_CODE and makes triggerRead pulse
      (hw/rtl/datalogger/nonstd/edge_datalogger/edge_datalogger.vhd:92-93,
      171-228). Starting from an empty ring, one trigger yields at least the
      five-word ZS header plus one edge payload word. This is not a claim that
      the planned semantic TRIG_MATCH engine is implemented.
    expected_outcome: "pass"
    falsifier: "DS-DE25-TRIG-001-RED"
    target: {board: "de25-standard"}
    capture_chain: *de25_chain
    preconditions:
      - {name: "sof_programmed", via: "freshly configured de25_datalogger image whose REA G_BUILD_ID is CONFIRMED"}
      - {name: "empty_ring", via: "power cycle; no daemon or foreign armer has produced traffic"}
      - {name: "hps_bridges_enabled", via: "generated DE25 boot command ran bridge enable"}
    steps:
      - {idx: 1, kind: "peek", addr: "0x20000150", expected: "0x00000000", comment: "positive anti-stale control: ring starts empty"}
      - {idx: 2, kind: "poke", addr: "0x20000020", value: "0x00000803", comment: "EDGE0 read-trigger + remain stopped"}
      - {idx: 3, kind: "wait_for", addr: "0x20000050", mask: "0x00004006", expected: "0x00004006", timeout_s: 5.0, comment: "DDR released, idle after commit, bvalid seen"}
      - idx: 4
        kind: "peek"
        addr: "0x20000150"
        expect: {range: {min: 6, max: 64}}
        derivation: >-
          A triggered edge sample is one payload word plus a five-word ZS
          header. The conservative 64-word ceiling admits lifecycle/framer
          bookkeeping but excludes prior boot traffic; step 1 independently
          proves the ring was empty immediately before the trigger.
    assertions:
      - {id: "G1", expr: "step[1].observed == step[1].expected"}
      - {id: "G2", expr: "step[3].satisfied == true"}
      - {id: "G3", expr: "step[4].satisfied == true"}

  - id: "DS-DE25-TRIG-001-RED"
    description: >-
      Negative control: write ordinary stopped CONFIG payload 0b00 instead of
      the 0b11 read-trigger. An empty idle ring remains empty, so the triggered
      frame assertion goes RED.
    expected_outcome: "demonstrated_broken"
    falsifier: "none"
    falsifier_waiver: "Negative control for DS-DE25-TRIG-001; omitting the trigger code is physically achievable."
    target: {board: "de25-standard"}
    capture_chain: *de25_chain
    preconditions: *live_preconditions
    steps:
      - {idx: 1, kind: "peek", addr: "0x20000150", expected: "0x00000000"}
      - {idx: 2, kind: "poke", addr: "0x20000020", value: "0x00000800", comment: "fault injection: stopped, no read-trigger"}
      - idx: 3
        kind: "peek"
        addr: "0x20000150"
        expect: {range: {min: 6, max: 64}}
        derivation: "The green trigger result; without trigger the empty ring remains at zero."
    assertions:
      - {id: "G1", expr: "step[1].observed == step[1].expected"}
      - {id: "G2", expr: "step[3].satisfied == true"}

  - id: "DS-DE25-TPUT-001"
    description: >-
      With the capture daemon and a connected TCP consumer active, the complete
      fabric-to-host path sustains the declared 4 Medge/s operating point. The
      host-owned RING_READ_PTR (not producer RING_WRITE_PTR) must advance fast
      enough to drain the design-derived stream while DDR_BACKPRESSURE_CNT stays
      zero. project_regbank.yml:323-340 defines RING_READ_PTR as the software
      DRAIN pointer; README.md:104-106 specifies that the daemon drains DDR and
      streams records over TCP. sw/stream/data_source.py:1437-1457 advances it
      only after parsing consumed frames; sustained socket backpressure stops
      subsequent drain calls in sw/stream/server.py:357-400.
    expected_outcome: "pass"
    falsifier: "DS-DE25-TPUT-001-RED"
    target: {board: "de25-standard"}
    capture_chain: *de25_chain
    preconditions:
      - {name: "sof_programmed", via: "de25_datalogger image whose REA G_BUILD_ID is CONFIRMED"}
      - {name: "hps_bridges_enabled", via: "generated DE25 boot command ran bridge enable"}
      - {name: "capture_daemon", via: "sw.stream DdrRingDataSource is running with write_back_read_ptr=true"}
      - {name: "host_consumer", via: "one TCP wave_stream_v1 consumer remains connected for the measurement"}
      - {name: "empty_ring", via: "daemon has drained below the low watermark before stimulus starts"}
    steps:
      - {idx: 1, kind: "poke", addr: "0x20000020", value: "0x00000800"}
      - {idx: 2, kind: "poke", addr: "0x20000020", value: "0x00000801"}
      - {idx: 3, kind: "poke", addr: "0x20000024", value: "0x00000080"}
      - {idx: 4, kind: "poke", addr: "0x20000244", value: "0x00000191"}
      - idx: 5
        kind: "rate"
        read: "0x20000154"
        interval_s: 2.0
        min_per_s: 14400000
        max_per_s: 105600000
        width: 28
        derivation: >-
          Integrity derives [3.6e6,26.4e6] 32-bit words/s at the declared
          operating point. RING_READ_PTR is a byte offset in the 2^28-byte
          ring, so the host drain band is exactly four times that range:
          [14.4e6,105.6e6] B/s. rr's rate step computes (c1-c0) mod 2^28, so
          the pointer must advance less than one full ring per window:
          interval_s x max_per_s = 2.0 x 105.6e6 = 2.112e8 < 2^28 = 2.684e8.
          (A 10 s window aliased: 30 MB/s read as 3.16 MB/s.)
      - {idx: 6, kind: "peek", addr: "0x20000168", expected: "0x00000000", comment: "no producer loss while host drains"}
      - {idx: 7, kind: "peek", addr: "0x2000016C", expect: {range: {min: 0, max: 2147483647}}, derivation: "bit31 must remain clear: ring below 75% live alarm"}
      - {idx: 8, kind: "poke", addr: "0x20000244", value: "0x00000000"}
    assertions:
      - {id: "T1", expr: "step[5].satisfied == true"}
      - {id: "T2", expr: "step[6].observed == step[6].expected"}
      - {id: "T3", expr: "step[7].satisfied == true"}

  - id: "DS-DE25-TPUT-001-RED"
    description: >-
      Negative control: stop the daemon/consumer while applying the identical
      producer load. RING_READ_PTR remains stationary, so the host-drain rate
      assertion immediately goes RED; continued load also fills the ring and is
      physically observable through the watermark/backpressure counters.
    expected_outcome: "demonstrated_broken"
    falsifier: "none"
    falsifier_waiver: "Negative control for DS-DE25-TPUT-001; a stopped host daemon is physically achievable."
    target: {board: "de25-standard"}
    capture_chain: *de25_chain
    preconditions:
      - {name: "sof_programmed", via: "de25_datalogger image whose REA G_BUILD_ID is CONFIRMED"}
      - {name: "hps_bridges_enabled", via: "generated DE25 boot command ran bridge enable"}
      - {name: "host_drain_stopped", via: "capture daemon is stopped; no process writes RING_READ_PTR"}
    steps:
      - {idx: 1, kind: "poke", addr: "0x20000020", value: "0x00000800"}
      - {idx: 2, kind: "poke", addr: "0x20000020", value: "0x00000801"}
      - {idx: 3, kind: "poke", addr: "0x20000024", value: "0x00000080"}
      - {idx: 4, kind: "poke", addr: "0x20000244", value: "0x00000191"}
      - idx: 5
        kind: "rate"
        read: "0x20000154"
        interval_s: 2.0
        min_per_s: 14400000
        max_per_s: 105600000
        width: 28
        derivation: "The green host-drain byte-rate band and the same non-wrapping 2.0 s window as DS-DE25-TPUT-001; a stopped daemon advances 0 B/s."
      - {idx: 6, kind: "poke", addr: "0x20000244", value: "0x00000000"}
    assertions:
      - {id: "T1", expr: "step[5].satisfied == true"}

  - id: "DS-DE25-DRAIN-001"
    description: >-
      Sustained drain. With the capture daemon and a connected TCP consumer
      active under the 4 Medge/s operating point (the TPUT-001 stimulus), the
      ring fill f = (RING_COMMIT_PTR - RING_READ_PTR) mod 2^28 does not grow by
      more than one drain tick over a window of at least 60 s, and
      DDR_BACKPRESSURE_CNT does not change. Equivalently, the read advance is at
      least the commit advance minus one tick (655 360 B = 4096 frames x 160 B).
      This is a separate claim from DS-DE25-TPUT-001: a 2 s drain rate above the
      14.4e6 B/s floor still lets the ring fill whenever it is below the ring
      write rate (about 20.0e6 B/s under this stimulus), and the 2^28-byte ring
      hides that for tens of seconds. Instrument: tools/hw/de25_probe_instr.py
      reads RING_READ_PTR, then RING_COMMIT_PTR, RING_WRITE_PTR,
      DDR_BACKPRESSURE_CNT, FIFO_OVERFLOW_CNT and the board uptime in ONE
      console line on every peek of RING_READ_PTR (steps 5, 7 and 9) and records
      them in the probe transcript; tools/hw/de25_fill_growth_oracle.py judges
      them (step 10), because the contract grammar cannot bound the difference
      of two registers read together (RTL-P3.2480). The ring write rate w is
      measured over S0 -> S1 (about 2 s, shorter than the 12.2 s a 22.0e6 B/s
      commit needs to wrap the ring) and must lie in [18.0e6, 22.0e6] B/s, so a
      dead stimulus (F = 0) is not green. A completely full ring has
      RING_COMMIT_PTR == RING_READ_PTR (rr-ddr-stream ptr_mgr tells full from
      empty by history only), so f reads 0 at full; the oracle therefore also
      fails fill_growth when DDR_BACKPRESSURE_CNT in the S2 sample differs from
      S0 (a full ring under the stimulus counts backpressure). Unmeasured term: inside one line the
      reads are sequential devmem processes, so RING_COMMIT_PTR is read a few
      process start-ups after RING_READ_PTR; the skew is not measured and is
      not added to the limit. On the code that DS-P1.74 run 3 measured (4096
      frames per tick, 13.1e6 B/s drain) both D1 and D2 are expected red on
      silicon: the fill grows at about 6.9e6 B/s, the ring is full in about
      39 s and DDR_BACKPRESSURE_CNT then counts. Open red: DS-T1.25. On the
      2104e288 image (byte-budget drain tick, 2026-11-11) D2 fails on fill
      growth alone (+1.36e6 B/s over 65.31 s at a 20.0e6 B/s write, receipt
      in runs/hw/DS-DE25-DRAIN-001/); this requirement stays red until
      DS-T1.25 is fixed.
    expected_outcome: "pass"
    falsifier: "DS-DE25-DRAIN-001-RED"
    target: {board: "de25-standard"}
    capture_chain: *de25_chain
    preconditions:
      - {name: "sof_programmed", via: "de25_datalogger image whose REA G_BUILD_ID is CONFIRMED"}
      - {name: "hps_bridges_enabled", via: "generated DE25 boot command ran bridge enable"}
      - {name: "capture_daemon", via: "sw.stream DdrRingDataSource is running with write_back_read_ptr=true"}
      - {name: "host_consumer", via: "one TCP wave_stream_v1 consumer remains connected for the measurement"}
      - {name: "empty_ring", via: "daemon has drained below the low watermark before stimulus starts"}
      - {name: "instrumented_probe", via: "RING_READ_PTR peeks go through tools/hw/de25_probe_instr.py; DS_PROBE_TRANSCRIPT names its transcript"}
    steps:
      - {idx: 1, kind: "poke", addr: "0x20000020", value: "0x00000800"}
      - {idx: 2, kind: "poke", addr: "0x20000020", value: "0x00000801"}
      - {idx: 3, kind: "poke", addr: "0x20000024", value: "0x00000080"}
      - {idx: 4, kind: "poke", addr: "0x20000244", value: "0x00000191"}
      - {idx: 5, kind: "peek", addr: "0x20000154", comment: "S0: window start (instrumented line)"}
      - idx: 6
        kind: "rate"
        read: "0x20000168"
        interval_s: 2.0
        min_per_s: 0
        max_per_s: 0
        width: 32
        derivation: "Hold between S0 and S1 for the ring write rate; DDR_BACKPRESSURE_CNT must not change (no producer loss)."
      - {idx: 7, kind: "peek", addr: "0x20000154", comment: "S1: end of the write-rate span (instrumented line)"}
      - idx: 8
        kind: "rate"
        read: "0x20000168"
        interval_s: 60.0
        min_per_s: 0
        max_per_s: 0
        width: 32
        derivation: >-
          The 60 s hold of the window. DDR_BACKPRESSURE_CNT counts clk_sys
          cycles while the ring is full and a frame waits; any change is
          producer loss. A 32-bit counter at 100 MHz wraps in 42.9 s, so a
          change is seen unless it is an exact multiple of 2^32 cycles.
      - {idx: 9, kind: "peek", addr: "0x20000154", comment: "S2: window end (instrumented line)"}
      - idx: 10
        kind: "oracle"
        cmd: ["python3", "tools/hw/de25_fill_growth_oracle.py", "--stim-addr", "0x20000244", "--stim-value", "0x00000191"]
        timeout_s: 30
        comment: "Judges S0, S1, S2 from the probe transcript: instrument, stimulus (w), window (>= 60 s), fill_growth (F <= 655 360 B)."
      - {idx: 11, kind: "poke", addr: "0x20000244", value: "0x00000000"}
    assertions:
      - {id: "P1", expr: "step[10].oracle.layers[instrument].status == pass"}
      - {id: "P2", expr: "step[10].oracle.layers[stimulus].status == pass"}
      - {id: "P3", expr: "step[10].oracle.layers[window].status == pass"}
      - {id: "D1a", expr: "step[6].satisfied == true"}
      - {id: "D1", expr: "step[8].satisfied == true"}
      - {id: "D2", expr: "step[10].oracle.layers[fill_growth].status == pass"}

  - id: "DS-DE25-DRAIN-001-RED"
    description: >-
      Negative control for DS-DE25-DRAIN-001: the same stimulus and the same
      instrumented window with the capture daemon stopped. RING_READ_PTR stands
      still while the ring is written at about 20.0e6 B/s, so the fill grows by
      far more than one tick (the ring is full after about 13 s from empty) and
      the fill_growth layer goes RED. The instrument, stimulus and window layers
      still pass, which shows the instrument and the stimulus were present.
    expected_outcome: "demonstrated_broken"
    falsifier: "none"
    falsifier_waiver: "Negative control for DS-DE25-DRAIN-001; a stopped host daemon is physically achievable."
    expected_red_layer: "fill_growth"
    mode: "default"
    target: {board: "de25-standard"}
    capture_chain: *de25_chain
    preconditions:
      - {name: "sof_programmed", via: "de25_datalogger image whose REA G_BUILD_ID is CONFIRMED"}
      - {name: "hps_bridges_enabled", via: "generated DE25 boot command ran bridge enable"}
      - {name: "host_drain_stopped", via: "capture daemon is stopped; no process writes RING_READ_PTR"}
      - {name: "instrumented_probe", via: "RING_READ_PTR peeks go through tools/hw/de25_probe_instr.py; DS_PROBE_TRANSCRIPT names its transcript"}
    steps:
      - {idx: 1, kind: "poke", addr: "0x20000020", value: "0x00000800"}
      - {idx: 2, kind: "poke", addr: "0x20000020", value: "0x00000801"}
      - {idx: 3, kind: "poke", addr: "0x20000024", value: "0x00000080"}
