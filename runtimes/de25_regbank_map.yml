- name: TELEMETRY_CTRL
  address: 320
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: Write bit[0]=1 to clear all telemetry counters. Self-clearing.
- name: TELEMETRY_SNAPSHOT_TRIGGER
  address: 324
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: Write bit[0]=1 to latch all counters atomically. Self-clearing.
- name: RING_WRITE_PTR
  address: 336
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: Number of 32-bit words the DDR stream has accepted from the framer since reset (free-running,
    wraps at 2^32). A word is counted on the cycle the stream takes it (valid and ready); cycles where
    the framer holds a word the stream cannot take are counted in DDR_BACKPRESSURE_CNT, not here. The
    value is an enqueue count, not a DRAM byte offset, because variable-length frames and beat alignment
    make RING_WRITE_PTR * 4 diverge from the DMA's committed offset, which is RING_COMMIT_PTR.
- name: RING_READ_PTR
  address: 340
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: "Software-managed ring DRAIN pointer (byte offset, mod RING_BYTES \u2014 NOT the old message\
    \ count). SW writes the byte offset it has CONSUMED up to, same frame/units as RING_COMMIT_PTR. Wired\
    \ to ddr_stream_axi.csr_rd_ptr_addr_i (load strobe held high); the IP frees the corresponding ring\
    \ space so the DMA write pointer auto-wraps \u2014 continuous, lossless SPSC drain, no double-read\
    \ (the PS already has the data from mmap; it only advances the pointer). Defaults to 0 at reset \u2192\
    \ ring fills once and stalls (legacy write-only behaviour) until SW starts advancing it. If the PS\
    \ falls behind, the producer stalls correctly (see DROP_CNT / ring-full feedback)."
- name: RING_BASE_LOW
  address: 344
  access: RO
  exempt: per-target generic (G_DDR_BASE_ADDR)
  description: Physical base address of the ring buffer in PS DDR, low 32 bits. Matches deepskopion_top.G_DDR_BASE_ADDR
    (default 0x10000000).
- name: RING_BASE_HIGH
  address: 348
  access: RO
  expected: '0x00000000'
  description: Physical base address of the ring buffer in PS DDR, high 32 bits. Always 0 on Zynq-7 (32-bit
    physical address space).
- name: RING_BYTES
  address: 352
  access: RO
  expected: '0x10000000'
  description: Size of the ring buffer in bytes. Matches 2^deepskopion_top.G_DDR_WIN_WIDTH (default 2^28
    = 256 MB).
- name: RING_COMMIT_PTR
  address: 356
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: "PS-LOOP-REQ-9. The live DMA write (commit) DDR address from ddr_stream_axi.wr_commit_addr_o\
    \ \u2014 where the HP0 DMA has ACTUALLY written, not where the enqueue counter (RING_WRITE_PTR) has\
    \ reached. The RingOracle MUST walk the ring only up to (RING_COMMIT_PTR - RING_BASE_LOW), not RING_WRITE_PTR*4,\
    \ to avoid reading un-committed regions. NOTE - 2-FF-synced from clk_ddr so it may bit-skew mid-transition;\
    \ combine with DDR_RESET_STATUS bit2 (ddr_write_idle, the DMA-caught-up flag) for the exact tail.\
    \ Reads 0 until the first write."
- name: DDR_BACKPRESSURE_CNT
  address: 360
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: "Free-running 32-bit count of clk_sys cycles where the framer has a frame to write but\
    \ the DDR DMA can't accept it (framer_out_valid && !ddr_s_axis_ready) \u2014 i.e. the ring is FULL\
    \ and incoming real-time datalogger traffic is being silently lost UPSTREAM of the per-protocol DROP_CNT/ERR_CNT\
    \ (which stay 0 because the datalogger can't even form a frame). A climbing value is the out-of-band\
    \ 'consumer fell behind, losing data NOW' signal that no handshake-level counter sees. Pairs with\
    \ the per-protocol DROP_CNT (arbiter backpressure) and the ring-fill watermark IRQ (RING_ALARM_CNT).\
    \ Reads 0 while a consumer keeps the ring draining (commit wraps forever)."
- name: RING_ALARM_CNT
  address: 364
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: "Ring-fill watermark alarm. bits[30:0] = number of times the ring fill crossed the HIGH\
    \ watermark (75% of RING_BYTES) \u2014 exactly one increment per fill excursion thanks to the hysteresis\
    \ latch (set at 75%, cleared only after the consumer drains below the LOW watermark = 50%). bit[31]\
    \ = the LIVE alarm level (the same signal wired to IRQ_F2P[0], level-high \u2192 GIC SPI"
- name: EMIT_VALID_CNT
  address: 368
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: "Probe. Saturating count of clk_sys cycles where error_event_emitter holds a pending in-band\
    \ loss frame (err_fr_valid=1). >0 proves the emitter latched a SEV_ERROR report on silicon when the\
    \ edge FIFO overflowed; =0 means it never latched (emitter/ERR_CNT-wiring issue). Pairs with EMIT_DONE_CNT\
    \ to localise where piece-3's loss frame is lost (framer\u2192uploader\u2192DDR)."
- name: EMIT_DONE_CNT
  address: 372
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: "Probe. Saturating count of emitter\u2192framer input handshakes (err_fr_valid AND err_fr_ready=framer\
    \ IN_READY). >0 proves the framer ACCEPTED the loss frame \u2192 the loss is DOWNSTREAM in the ddr_stream_axi\
    \ uploader; =0 with EMIT_VALID_CNT>0 proves the framer never accepted it (the framer is never in S_IDLE\
    \ while err_fr_valid holds \u2014 mux/idle starvation). Read both after forcing an overflow (pin RING_READ_PTR\
    \ ahead of commit) to discriminate."
- name: EYE_CONTROL
  address: 512
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: "Eye-scan control word. Bit[0]=start \u2014 a 0\u21921 transition launches one measurement\
    \ (CSR-pulse idiom; write 0 then 1 to re-arm). Bit[1]=aggressor_en \u2014 drive the adjacent PMOD\
    \ pin with an uncorrelated PRBS (crosstalk mode) for the duration of the run. Bit[2]=selftest \u2014\
    \ internal TX\u2192RX loopback (bypass PMOD+IDELAY). Bits[9:4]=phase_sel \u2014 IDELAYE2 tap (0..31,\
    \ fine sub-step phase axis) feeding idelay_scan on the RX loopback pin. Bits[15:12]=freq_sel \u2014\
    \ clk_drp MMCM-DRP frequency-profile index (the eye's frequency axis). Bits[18:16]=sample-clock phase-shift\
    \ command (full-UI axis) \u2014 bit[16]=ps_step \u2014 a 0\u21921 transition advances the CLKOUT1\
    \ sample_clk phase by one MMCM fine step (\u224817.86 ps); bit[17]=ps_incdec (1=advance/0=retard);\
    \ bit[18]=ps_rst \u2014 a 0\u21921 transition zeroes the fabric phase-step counter (EYE_PHASE_STATUS).\
    \ Poll EYE_PHASE_STATUS.ps_busy=0 between steps. A freq_sel change relocks the MMCM and re-zeroes\
    \ the actual sample phase. Remaining bits reserved (read 0)."
- name: EYE_BIT_TARGET
  address: 516
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: "Eye-scan measurement length. Number of PRBS bit periods to DRIVE for one (freq,phase)\
    \ point. The self-syncing checker accrues BIT_COUNT only post-lock, so the measured EYE_BIT_COUNT\
    \ is BIT_TARGET minus the lock latency (~ORDER+lock-threshold+loopback-delay). Larger targets lower\
    \ the measurable BER floor (floor \u2248 1/BIT_COUNT). 0 = defined no-op (engine DONEs with no measurement)."
- name: EYE_STATUS
  address: 520
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: "Eye-scan engine status. Bit[0]=busy (a measurement is in flight). Bit[1]=done (the last\
    \ measurement finished; counters frozen and valid to read). Bit[2]=locked (the checker self-synchronised\
    \ to the loopback PRBS this run \u2014 0 with done=1 means the link was dead/too-closed at this point,\
    \ i.e. a genuine eye-closed cell, NOT a tooling error). Poll until done=1, then read the counters."
- name: EYE_ERR_COUNT_LO
  address: 524
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: "Eye-scan bit-error count, low 32 bits. Detected received-bit errors over the post-lock\
    \ window of the last measurement. Combine with EYE_ERR_COUNT_HI for the full 48-bit count. Each isolated\
    \ line error appears as (taps+1)=3 detected errors via the self-syncing descrambler \u2014 the host's\
    \ BER = ERR/BIT inherits the same factor consistently across all cells, so relative eye shape is exact."
- name: EYE_ERR_COUNT_HI
  address: 528
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: Eye-scan bit-error count, high 16 bits in bits[15:0]; bits[31:16] read 0. Forms the upper
    half of the 48-bit error counter with EYE_ERR_COUNT_LO.
- name: EYE_BIT_COUNT_LO
  address: 532
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: "Eye-scan measured-bit count, low 32 bits. Bits actually checked post-lock in the last\
    \ measurement (the BER denominator). Combine with EYE_BIT_COUNT_HI for the full 48-bit count. A value\
    \ of 0 with EYE_STATUS.done=1 means the engine never locked \u2192 no measurement for this (freq,phase)\
    \ cell (eye fully closed / link dead), distinct from a measured BER of 0."
- name: EYE_BIT_COUNT_HI
  address: 536
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: Eye-scan measured-bit count, high 16 bits in bits[15:0]; bits[31:16] read 0. Forms the
    upper half of the 48-bit bit counter with EYE_BIT_COUNT_LO.
- name: EYE_PHASE_STATUS
  address: 540
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: "Eye-scan sample-clock phase-shift status. Bits[15:0]=ps_count \u2014 the net number of\
    \ MMCM fine phase steps applied to the CLKOUT1 sample_clk since the last ps_rst / freq reconfig (a\
    \ signed-magnitude walk, +1 per advance step and \u22121 per retard, two's-complement in 16 bits).\
    \ Multiply by ~17.86 ps (VCO_period/56 at the 1000 MHz VCO) for the absolute sample-phase offset;\
    \ one full UI = (1000/D)\xB7... \u2248 56\xB7D/10 steps. Bit[16]=ps_busy \u2014 a phase step (EYE_CONTROL.ps_step)\
    \ is in flight; poll until 0 before issuing the next step or trusting ps_count. ADD-only slot \u2014\
    \ shared system_regbank, canfd_demo unaffected."
