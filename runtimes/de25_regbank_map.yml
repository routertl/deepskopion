# GENERATED by tools/de25_regbank_map.py from project_regbank.yml and the
# CSR aperture of targets/de25_datalogger.yml — do not edit; regenerate.
#
# The register map runtimes/hw.yml hands routertl's map-access preamble
# (DS-T2.86): the regbank's byte offsets at the lwh2f regbank base. The
# regbank generators never read this file.
name: system_regs
version: 0.3.0
address_mode: bytes
base_address: '0x20000000'
registers:
- name: GIT_HASH
  address: 0
  access: RO
  exempt: build stamp, differs per bitstream (the capture chain confirms the REA build ID)
  description: Git commit hash of the build
- name: SYSTEM_VERSION
  address: 4
  access: RO
  exempt: build stamp, differs per bitstream (the capture chain confirms the REA build ID)
  description: System firmware version (semantic versioning)
- name: BUILD_DATE
  address: 8
  access: RO
  exempt: build stamp, differs per bitstream (the capture chain confirms the REA build ID)
  description: Build timestamp (Unix epoch)
- name: REGBANK_VERSION
  address: 12
  access: RO
  expected: '0x00030000'
  description: Register bank version (encoded as major.minor.patch)
- name: REGBANK_NUM_WORDS
  address: 16
  access: RO
  exempt: 'read side effect: a read resets or advances a manifest stream pointer'
  description: Number of words in the register bank schema (manifest). Reading this register also resets
    the streaming pointer for REGBANK_DATA to 0.
- name: REGBANK_DATA
  address: 20
  access: RO
  exempt: 'read side effect: a read resets or advances a manifest stream pointer'
  description: Streaming-read port for the regbank manifest ROM. Each read returns the next 32-bit word
    from regbank_schema.hex and advances the internal pointer. Read REGBANK_NUM_WORDS first to seed the
    count + reset pointer.
- name: CONFIG_NUM_WORDS
  address: 24
  access: RO
  exempt: 'read side effect: a read resets or advances a manifest stream pointer'
  description: Number of words in the build configuration manifest (which dataloggers + how many are baked
    into this bitstream). Reading this register also resets the streaming pointer for CONFIG_DATA to 0.
- name: CONFIG_DATA
  address: 28
  access: RO
  exempt: 'read side effect: a read resets or advances a manifest stream pointer'
  description: Streaming-read port for the build-config ROM (config_schema.hex). Each read returns the
    next 32-bit word and advances the pointer. See datalogger_gather_gen.py for the v0.1 encoding (magic
    0xC0A1DE01 + count + per-instance words).
- name: DATALOGGER_CONFIG
  address: 32
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: Per-datalogger runtime control word. Low 16 bits drive datalogger_gather.CONFIG via the
    config_control demux. CONFIG[15:11] selects the addressed datalogger_id; CONFIG[10:0] is the per-datalogger
    payload (e.g. CONFIG[0]=enable). See docs/standards/datalogger_compliance_checklist.md section 4.
- name: EMIO_MUX_SEL
  address: 36
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: Per-protocol pre-gather source selector. Bit[0]=I2C
- name: CONTRACT_ABI_VER
  address: 40
  access: RO
  expected: '0x00020000'
  description: RTL<->PS-software contract ABI version, driven by deepskopion_top from C_CONTRACT_ABI_VER.
    Mirror of sw.stream.testbench.provenance.CONTRACT_ABI_VER; run_self_test compares the two at startup
    and ERRORs (exit 2, harness-broken) on mismatch so version-skew can never be read as a DUT verdict.
    Reads 0 on bitstreams that predate ABI versioning (self-test treats 0 as "unversioned" -> warn, not
    error). Bump major on any breaking change to the EMIO injector load/edge-detect contract.
- name: EMIO_PROBE
  address: 44
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: "EMIO-loop probe tap. Live snapshot of the EMIO loopback seam \u2014 the same 31-bit probe_word\
    \ fed to the rr_rea_xilinx7 REA core in deepskopion_top, plus bit[31]=REA-triggered sticky. Read over\
    \ AXI/devmem for a static \"does the EMIO signal reach the injector/datalogger, does the injector\
    \ drive back\" check without a JTAG capture. Bit map (LSB-first) is documented in debug/emio_seam.yml;\
    \ the REA core gives the cycle-accurate waveform of the same bits."
- name: I2C_INJ_CONTROL
  address: 48
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: I2C injector control. Bit[0]=enable. Bits[7:1]=slave 7-bit address. Bit[9]=fifo_reset (self-clearing).
    Remaining bits reserved.
- name: I2C_INJ_DATAIN
  address: 52
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: I2C injector TX-FIFO write strobe. Each PS write pushes the low 8 bits into the slave's
    TX FIFO; the slave returns those bytes on master-read transactions in FIFO order.
- name: I2C_INJ_STATUS
  address: 56
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: I2C injector status. Bit[0]=fifo_empty. Bit[1]=fifo_prog_full. Bit[2]=slave error sticky.
    Bits[9:3]=fifo data count (depth+1 wide).
- name: SPI_INJ_CONTROL
  address: 64
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: SPI injector control. Bit[0]=enable. Bit[9]=fifo_reset (self-clearing). Bits[8:1] + remaining
    reserved for future SPI mode bits.
- name: SPI_INJ_DATAIN
  address: 68
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: SPI injector TX-FIFO write strobe. Each PS write pushes the low 8 bits into the slave's
    TX FIFO; the slave drives MISO with those bytes on the next master transaction.
- name: SPI_INJ_STATUS
  address: 72
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: SPI injector status. Bit[0]=fifo_empty. Bit[1]=fifo_prog_full. Bits[9:3]=fifo data count.
    Bit[2] reserved (no slave-side error path in v1).
- name: STIM_UART_CONTROL
  address: 544
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: Stimulus UART TX generator control. Bit[0]=enable. Bit[1]=break pattern (each DATA write
    sends DATA[15:0] breaks, 0=1, of Bits[15:8] low bit-times, 0=1, then one high bit-time). Remaining
    bits reserved.
- name: STIM_UART_BAUD_DIV
  address: 548
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: Stimulus UART TX bit period, in clk_sys cycles. Values <2 are floored to 2 in RTL. 8N1
    framing, LSB-first.
- name: STIM_UART_DATA
  address: 552
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: Stimulus UART TX write-strobe, acted on while CONTROL[0]=1 and the generator is idle. With
    CONTROL[1]=0 each PS write sends its low 8 bits as one 8N1 frame. With CONTROL[1]=1 each write sends
    DATA[15:0] breaks (0=1), each the line low for CONTROL[15:8] bit-times (0=1) then high for one bit-time.
    A write landing while a frame or break pattern is in flight is dropped (no queue).
- name: STIM_I2C_CONTROL
  address: 556
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: Stimulus I2C master generator control. Bit[0]=enable. Bits[7:1]=target 7-bit I2C address.
    Remaining bits reserved.
- name: STIM_I2C_CLK_DIV
  address: 560
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: Stimulus I2C master SCL quarter-period, in clk_sys cycles. Values <2 are floored to 2 in
    RTL. No clock stretching support (v1).
- name: STIM_I2C_DATA
  address: 564
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: Stimulus I2C master write-strobe. Each PS write to the low 8 bits, while CONTROL[0]=1 and
    the generator is idle, runs one complete START + 7-bit-addr+W + data-byte + STOP write transaction
    against CONTROL[7:1]. A write landing mid-transaction is dropped (no queue).
- name: STIM_SPI_CONTROL
  address: 568
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: Stimulus SPI master generator control. Bit[0]=enable. Remaining bits reserved.
- name: STIM_SPI_CLK_DIV
  address: 572
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: Stimulus SPI master SCLK half-period, in clk_sys cycles. Mode 0 (CPOL=0/CPHA=0), MSB-first,
    8 bits/transfer.
- name: STIM_SPI_DATA
  address: 576
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: Stimulus SPI master write-strobe. Each PS write to the low 8 bits, while CONTROL[0]=1 and
    the generator is idle, shifts one byte out MOSI framed by SS. A write landing mid-transfer is dropped
    (no queue).
- name: STIM_EDGE_CONTROL
  address: 580
  access: RW
  exempt: 'software-owned configuration: reads what the last writer left'
  description: Stimulus edge/pulse source control. Bit[0]=enable (free-running 50% duty toggle when set;
    held low when clear). Bits[19:4]=half-period in clk_sys cycles (0 floored to 1 in RTL). Feeds deepskopion_core's
    EDGE0 self-test tap when EMIO_MUX_SEL bit[7]=1.
- name: CLK_DDR_TICKS
  address: 76
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: clk_ddr (fclk_clk1, 125 MHz) liveness edge-count. A free-running divide-by-256 toggle in
    the clk_ddr domain (NO rst_ddr dependence) is CDC'd to clk_sys and edge-counted. Read twice ~100 ms
    apart - a nonzero delta proves clk_ddr is running; a stuck value means the HP0 DMA write clock is
    dead. Distinguishes 'dead clock' from 'stuck reset' (see DDR_RESET_STATUS).
- name: DDR_RESET_STATUS
  address: 80
  access: RO
  exempt: live value on a running board (counter, pointer or status)
  description: rst_ddr (HP0 DMA-domain reset) observed in clk_sys. Bit[0]=live rst_ddr (1=asserted/held
    in reset). Bit[1]=sticky 'rst_ddr ever deasserted since config' (latches 1 the first time reset releases;
    never clears). Bit[2]=ddr_write_idle - the DMA write side is IDLE, all enqueued frames are committed
    to DRAM; when set, the PS may safely read the ring up to RING_WRITE_PTR (the robust RingOracle 'caught
    up' signal, PS-LOOP-REQ-9). If bit[1]=0 the DDR write FSM never came out of reset. Write-plane arming
    (previously-reserved upper bits, backward-compatible - old readers masked them as 0). Bit[6:3]=dbg_reset_status_o
    synced {downloader_cs, uploader_cs, pipeBusyDdr, pipeBusy}. Bit[7]=chip_empty - the CDC empty flag
    the uploader uses to decide there is data to write; STUCK 1 means the uploader sees no data and never
    arms (the key divergence probe). Bit[8]=pipe empty. Bit[9]=user FIFO full. Bit[10]=write_error (BRESP/=OKAY
    sticky). Bit[16:11]=sticky 'ever seen since rst_ddr' {aw_valid(11), aw_handshake(12), wvalid(13),
    bvalid(14), write_active/idle-ever-0(15), write_error(16)} - aw_valid=0 forever is the 'no AW ever
    issued' wedge; a working 0.3.1 build sets aw_valid/aw_handshake/bvalid/write_active. Bit[31:17]=reserved
    0.
